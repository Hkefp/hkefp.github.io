<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Hkefp</title>
    <link rel="icon" href="circle.png" type="image/png">

    <meta content="Hkefp" property="og:title" />
    <meta content="https://hkefp.github.io" property="og:url" />
    <meta content="https://raw.githubusercontent.com/Hkefp/hkefp.github.io/refs/heads/main/hkefp.png" property="og:image" />
    <style>

        @font-face {
            font-family: "ubuntu";
            src: url("ubuntu.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #99d9ea;
            color: #ffffff;
            font-family: "ubuntu";
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 30px 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            margin: inherit;
            
            box-shadow: 0px 0px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 5px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0;
            border-radius: 50%;
            display: flow;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo img {
            width: 100%;
            height: auto;
            object-fit: cover;
            -webkit-user-drag: none;
        }

        h1 {
            font-size: 50px;
            margin: 0;
            font-weight: 500;
            background: #ffffff;
            background-clip: text;
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                gap: 0;
            }

            h1 {
                margin-top: 10px;
            }
        }

        .links {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.15s ease;
            flex: 1 1 calc(50% - 4px);
            min-width: 200px;
        }

        @media (max-width: 480px) {
            .links {
                flex-direction: column;
            }

            .link-btn {
                flex: 1 1 100%;
            }
        }

        .link-btn:hover {
            background: rgba(0, 0, 0, 0.35);
        }

        .link-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .link-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .link-name {
            font-size: 16px;
            font-weight: 500;
        }

        .link-url {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }

        .view-count {
            margin-top: 10px;
            margin-bottom: -18px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }

        
    </style>

</head>
<body>
    <div class="container">

        <div class="header">

        <div class="logo">

            <a>
                <img src="hkefp.png" alt="Hkefp" draggable="false">
            </a>

        </div>

            <h1>Hkefp</h1>

        </div>

        <div class="links">
            <a class="link-btn" href="https://osu.ppy.sh/users/hkefp" target="_blank" draggable="false">
                <img class="link-icon" src="icons/osu.jpg" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">osu!</span>
                    <span class="link-url">osu.ppy.sh/users/hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://www.youtube.com/@hkefp" target="_blank" draggable="false">
                <img class="link-icon" src="icons/youtube.png" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">youtube</span>
                    <span class="link-url">youtube.com/@hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://twitch.tv/hke1p" target="_blank" draggable="false">
                <img class="link-icon" src="icons/twitch.png" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">twitch</span>
                    <span class="link-url">twitch.tv/hke1p</span>
                </span>
            </a>
            <a class="link-btn" href="https://github.com/Hkefp" target="_blank" draggable="false">
                <img class="link-icon" src="icons/github.png" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">github</span>
                    <span class="link-url">github.com/Hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://steamcommunity.com/id/Hkefp/" target="_blank" draggable="false">
                <img class="link-icon" src="icons/steam.png" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">steam</span>
                    <span class="link-url">steamcommunity.com/id/Hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://psnprofiles.com/Hkefp" target="_blank" draggable="false">
                <img class="link-icon" src="icons/psn.jpg" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">psn</span>
                    <span class="link-url">psnprofiles.com/Hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://www.albumoftheyear.org/user/hkefp/" target="_blank" draggable="false">
                <img class="link-icon" src="icons/aoty.jpg" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">aoty</span>
                    <span class="link-url">albumoftheyear.org/user/Hkefp</span>
                </span>
            </a>
            <a class="link-btn" href="https://www.last.fm/user/Hkefp" target="_blank" draggable="false">
                <img class="link-icon" src="icons/fm.png" alt="" draggable="false">
                <span class="link-text">
                    <span class="link-name">last.fm</span>
                    <span class="link-url">last.fm/user/Hkefp</span>
                </span>
            </a>
        </div>

        <div class="view-count"><span id="view-count-num">···</span> views</div>
    </div>

    <script>
        fetch('https://counterapi.com/api/hkefp.github.io/view/home')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                document.getElementById('view-count-num').textContent = data.value.toLocaleString();
            });
    </script>
</body>
</html>
